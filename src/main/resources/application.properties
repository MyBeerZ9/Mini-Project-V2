# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=car-rental-system

# Database Configuration
# Default: Fast, resilient in-memory database with pre-seeded 14 cars.
# For Supabase PostgreSQL, set environment variables:
#   DB_URL=jdbc:postgresql://db.<your-project-ref>.supabase.co:5432/postgres?sslmode=require
#   DB_USERNAME=postgres
#   DB_PASSWORD=<your-supabase-db-password>
#   DB_DRIVER=org.postgresql.Driver
#   DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${DB_URL:jdbc:h2:mem:cardb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/,file:./
